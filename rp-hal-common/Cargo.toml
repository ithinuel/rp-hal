[package]
authors = ["The rp-rs Developers"]
description = "Shared HAL code for the Raspberry Pi microcontrollers"
edition = "2021"
homepage = "https://github.com/rp-rs/rp-hal"
license = "MIT OR Apache-2.0"
name = "rp-hal-common"
repository = "https://github.com/rp-rs/rp-hal"
rust-version = "1.79"
version = "0.1.0"

# DO NOT LIST ANY PAC CRATES OR ARCHITECTURE CRATES HERE
[dependencies]
fugit = "0.3.7"
rp-pac-common = { path = "../rp-pac-common" }
rp2040-pac = { version = "0.7.0", optional = true }
rp235x-pac = { version = "0.1.0", optional = true }

[features]
# The `rp2040` feature enables the RP2040-specific HAL code.
rp2040 = ["rp2040-pac"]
# The `rp235x` feature enables the RP235x-specific HAL code.
rp235x = ["rp235x-pac"]
